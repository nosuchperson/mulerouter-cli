name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      artifact-retention-days: 7

  verify:
    name: Verify tag matches package versions
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          cli=$(node -p "require('./packages/cli/package.json').version")
          core=$(node -p "require('./packages/core/package.json').version")
          echo "tag=$tag cli=$cli core=$core"
          if [ "$tag" != "$cli" ] || [ "$tag" != "$core" ]; then
            echo "::error::Tag v$tag does not match cli=$cli / core=$core"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to npm (v${{ needs.verify.outputs.version }})
    needs: [build, verify]
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/mulerouter/v/${{ needs.verify.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        # version auto-detected from package.json "packageManager" field

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Download built dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages

      - name: Pin npm to a Trusted-Publishing-capable version
        run: npm install -g npm@11.5.1

      - name: Publish @mulerouter/core
        working-directory: packages/core
        run: npm publish --provenance --access public

      - name: Publish mulerouter CLI
        working-directory: packages/cli
        run: npm publish --provenance --access public
