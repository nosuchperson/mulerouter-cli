name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

      - name: Smoke test built artifacts
        run: |
          node packages/cli/dist/cli.js --version
          node packages/cli/dist/cli.js list --json > /dev/null
          node -e "import('./packages/core/dist/index.js').then(m => { if (!m.loadConfig) process.exit(1); })"

      - name: Verify tag matches package versions
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cli=$(node -p "require('./packages/cli/package.json').version")
          core=$(node -p "require('./packages/core/package.json').version")
          echo "tag=$tag cli=$cli core=$core"
          if [ "$tag" != "$cli" ] || [ "$tag" != "$core" ]; then
            echo "::error::Tag v$tag does not match cli=$cli / core=$core"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload built dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            packages/cli/dist
            packages/core/dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm (v${{ needs.build.outputs.version }})
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/mulerouter/v/${{ needs.build.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Download built dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages

      - name: Upgrade npm (Trusted Publishing requires >= 11.5.1)
        run: npm install -g npm@latest

      - name: Publish @mulerouter/core
        working-directory: packages/core
        run: npm publish --provenance --access public

      - name: Publish mulerouter CLI
        working-directory: packages/cli
        run: npm publish --provenance --access public
